</g><text x="36" y="510" font-size="15">Transparent fused silica 2.000 X x 2.000 Y x 0.300 Z.</text><text x="36" y="533" font-size="15">Island diameter 0.200 on underside; center 0.350 from free +X edge, centered Y.</text><text x="36" y="556" font-size="15">No opaque support or bond over the island. Hot bond extends X=-1.600 to -0.800 relative to pad.</text><text x="36" y="579" font-size="15">Thin-film process and complete contact-line observation require lab qualification.</text><text x="36" y="622" font-size="12">Source model.py + spec.json. Linear dimensions govern. Do not scale this drawing.</text></g></svg>