</g><text x="36" y="510" font-size="15">30.000 x 30.000 x 3.000 aluminum adapter blank.</text><text x="36" y="533" font-size="15">Two internal diameter 4.500 THRU holes on a 20.000 pitch, centered on the blank.</text><text x="36" y="556" font-size="15">X configuration mounts on upright face. Z configuration mounts on shelf top.</text><text x="36" y="579" font-size="15">Remaining vendor sensor pattern is UNMACHINED. No supplier compatibility claimed.</text><text x="36" y="602" font-size="15">These orthogonal mounting datums do not establish where an actual sensor tip will lie.</text><text x="36" y="625" font-size="15">Lab/supplier must accept sensor envelope and reproduce the unchanged hot-joint datum.</text><text x="36" y="668" font-size="12">Source model.py + spec.json. Linear dimensions govern. Do not scale this drawing.</text></g></svg>